[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-reply-agent"
version = "0.1.0"
description = "Local RAG menubar agent that suggests WhatsApp replies in your voice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "lancedb>=0.17.0",
    "pyarrow>=17.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "playwright>=1.48.0",
    "rumps>=0.4.0",
    "pynput>=1.7.7",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
personal-reply = "personal_reply.cli:main"
personal-reply-menubar = "personal_reply.menubar:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_reply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
